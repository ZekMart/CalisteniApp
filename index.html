<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121417">
<title>Calistenia Competitiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121417;--sf:#1b1e23;--sf2:#252930;--ln:#343a45;--tx:#eef0f3;--mt:#9aa1ad;
  --ac:#ff3b3b;--am:#ffb020;--ok:#3ecf8e;--rest:#0f1c27;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;
  --fd:'Bebas Neue',Impact,'Arial Narrow',sans-serif;--fb:'Barlow',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 var(--fb);-webkit-tap-highlight-color:transparent}
body{padding-top:env(safe-area-inset-top)}
header.top{padding:14px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;max-width:720px;margin:0 auto}
h1{font:2rem/1 var(--fd);letter-spacing:.04em;margin:0}
h1 b{color:var(--ac);font-weight:400}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
#v{display:grid;gap:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
h2{font:1.55rem/1 var(--fd);letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font-weight:700;margin:0;font-size:1rem;text-wrap:balance}
p{margin:0}
.mt{color:var(--mt);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sb{justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--sf2);border:1px solid var(--ln);color:var(--tx);border-radius:999px;padding:7px 12px;font:600 .85rem var(--fb);cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 14px;font:700 1rem var(--fb);cursor:pointer;white-space:nowrap}
.btn.sec{background:var(--sf2);color:var(--tx);border:1px solid var(--ln)}
.btn.sm{padding:8px 11px;font-size:.85rem}
.btn:active{transform:scale(.98)}
input,select,textarea{background:var(--sf2);border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:9px;font:1rem var(--fb);width:100%}
textarea{resize:vertical;line-height:1.5}
label{display:grid;gap:4px;font-size:.82rem;color:var(--mt)}
label.ck{display:flex;align-items:center;gap:10px;font-size:.95rem;color:var(--tx)}
label.ck input{width:auto;transform:scale(1.3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
td,th{padding:6px 5px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
th{color:var(--mt);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right}
.num{font:2rem/1 var(--fd);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--sf2);border:1px solid var(--ln);white-space:nowrap}
.pill.ac{background:var(--ac);border-color:var(--ac);color:#fff}
.pill.ok{background:var(--ok);border-color:var(--ok);color:#06231a}
.pill.am{background:var(--am);border-color:var(--am);color:#2a1a00}
.block{border-left:3px solid var(--ac);padding:9px 10px;background:var(--sf2);border-radius:0 8px 8px 0;display:grid;gap:4px}
.block.note{border-left-color:var(--ln)}
.block .row{flex-wrap:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--sf2);border-radius:10px;padding:10px;display:grid;gap:2px}
.stat span{font-size:.75rem;color:var(--mt);text-transform:uppercase;letter-spacing:.05em}
ul.tips{margin:0;padding-left:18px;display:grid;gap:6px}
details{background:var(--sf2);border-radius:10px;padding:10px}
details summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:6px}
pre{white-space:pre-wrap;font:.82rem/1.45 ui-monospace,monospace;color:var(--mt);margin:6px 0 0}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{background:none;border:0;color:var(--mt);padding:9px 0 11px;font:600 .72rem var(--fb);display:grid;justify-items:center;gap:3px;cursor:pointer}
nav.tabs button.on{color:var(--ac)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}

#pl{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) 16px calc(14px + env(safe-area-inset-bottom));transition:background .3s}
#pl.on{display:grid}
#pl.rest{background:var(--rest)}
.plh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;max-width:560px;width:100%;margin:0 auto}
.plh b{font:1.3rem/1.1 var(--fd);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#plC{display:grid;align-content:center;justify-items:center;text-align:center;gap:8px;overflow-y:auto;max-width:560px;width:100%;margin:0 auto;padding:6px 0}
#plClock{font:clamp(4.2rem,24vw,8.5rem)/.9 var(--fd);font-variant-numeric:tabular-nums}
#plPhase{font:700 .85rem var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--am)}
#plEx{font:clamp(1.9rem,9.5vw,3.2rem)/1.02 var(--fd);letter-spacing:.03em;text-wrap:balance}
#plReps{font:clamp(3.4rem,18vw,6.5rem)/.9 var(--fd);color:var(--ac)}
#plStrat{background:var(--sf2);border:1px solid var(--ln);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.92rem}
#plNext{color:var(--mt)}
.bar{height:6px;background:var(--sf2);border-radius:3px;width:100%;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.plfig{display:grid;place-items:center}
.plf{display:grid;gap:8px;max-width:560px;width:100%;margin:0 auto}
#plBtn{font-size:1.45rem;padding:22px;border-radius:16px;font-family:var(--fd);letter-spacing:.06em}
#plStep{display:none;align-items:center;gap:18px;justify-content:center}
#plStep button{width:56px;height:56px;border-radius:50%;font-size:1.7rem;padding:0}
#plVal{font:3rem/1 var(--fd);min-width:70px;text-align:center}
#plCtl{display:none;grid-template-columns:1fr 1fr;gap:8px}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:40;padding:16px}
.modal.on{display:grid}
.modal .card{max-width:440px;width:100%}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;z-index:50;display:none;max-width:90vw}
svg .q{stroke:var(--mt);stroke-width:1.6;fill:none}svg .qb{stroke:var(--mt);stroke-width:3.4;stroke-linecap:round;fill:none}svg .qp{stroke:var(--mt);stroke-width:5}svg .qf{fill:var(--sf);stroke:var(--ln)}svg .qr{fill:none;stroke:var(--mt);stroke-width:2.4}svg .qd{stroke:var(--am);stroke-width:2;stroke-dasharray:3 2;fill:none}svg .fg{stroke:var(--tx);stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round;fill:none}svg .f2{opacity:.38}svg .tr{stroke-width:5.6}svg .hd{fill:var(--tx)}svg .wt{fill:var(--ac)}
svg.th{width:66px;height:58px;flex:none;background:var(--sf);border-radius:8px}
svg.big{width:100%;max-width:440px;height:auto;aspect-ratio:160/140;background:var(--sf2);border-radius:12px;border:1px solid var(--ln)}
svg.pf{width:min(46vw,190px);height:auto;aspect-ratio:160/140;background:var(--sf2);border-radius:10px}
.xfig{display:grid;place-items:center}
.exl{display:grid;gap:6px}
.exr{display:flex;align-items:center;gap:8px;background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:5px 7px}
.exr.cur{border-color:var(--ac)}
.exb{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--tx);text-align:left;font:inherit;cursor:pointer;flex:1;min-width:0;padding:0}
.exn{flex:1;display:grid;min-width:0}
.exn .mt{font-size:.8rem}
.ov{position:fixed;inset:0;background:var(--bg);z-index:22;display:none;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.ov.on{display:grid}
#xd{z-index:24}
.ovh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--ln)}
.ovh b{font:1.35rem/1.1 var(--fd);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovc{overflow-y:auto;padding:12px 16px 20px;display:grid;gap:12px;align-content:start;width:100%;max-width:720px;margin:0 auto}
.ovf{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--ln);width:100%;max-width:720px;margin:0 auto}
ol.steps{margin:0;padding-left:20px;display:grid;gap:4px}
a.btn{text-decoration:none;text-align:center;display:block}
a{color:var(--am)}
.btn:disabled{opacity:.45;cursor:default}
.ch{position:relative}.chs{width:100%;height:auto;display:block;touch-action:pan-y}
svg .gr{stroke:var(--ln);stroke-width:1}svg .ax{fill:var(--mt);font:10px var(--fb)}svg .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}svg .tl{stroke-width:1.5;stroke-dasharray:4 4;opacity:.75}svg .dt{stroke:var(--sf);stroke-width:2}svg .xh{stroke:var(--mt);stroke-width:1}svg .xb{fill:var(--tx);opacity:.07}
.tip{position:absolute;top:2px;display:none;background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:6px 9px;font-size:.8rem;pointer-events:none;min-width:130px;z-index:2;box-shadow:0 4px 14px #0007}
.tip i,.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem}.lg em{font-style:normal}
details.tv{background:none;padding:0}details.tv summary{font-size:.82rem;color:var(--mt);font-weight:600}
.gh{width:100%;max-width:420px;display:grid;gap:4px}.ghr{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:8px;font-size:.8rem;color:var(--mt)}.bar.gb i{background:var(--mt)}
.ghd{font-size:.92rem;color:var(--mt)}.up{color:var(--ok)}.dn{color:var(--ac)}.ghbox{display:grid;gap:6px;justify-items:center;max-width:420px}
.aio{display:grid;gap:6px}.aio h3{margin-top:6px}.stat em{font-style:normal;font-size:.75rem}
.rpe{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.rpe .chip{min-width:38px}
.card.warn{border-color:var(--am)}
.hrp{font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sf2);border:1px solid var(--ln);font-variant-numeric:tabular-nums;white-space:nowrap}
.hrp.z1,.hrp.z2{color:var(--c1)}.hrp.z3{color:var(--ok)}.hrp.z4{color:var(--am)}.hrp.z5{color:var(--ac)}
.kgw{display:none;align-items:center;gap:12px;justify-content:center}.kgw span{font:1.6rem/1 var(--fd);min-width:150px;text-align:center}
select{appearance:auto}
.ht{display:grid;gap:2px;min-width:0}#hdr{font-size:.8rem}
header.top{align-items:center!important}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--ac);color:#fff;border:0;font:700 1.1rem var(--fb);display:grid;place-items:center;cursor:pointer;flex:none}
.avatar.sm{width:32px;height:32px;font-size:.9rem}
.seg{display:flex;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:4px;position:sticky;top:0;z-index:4;box-shadow:0 6px 12px -8px #000a}
.seg button{flex:1;background:none;border:0;color:var(--mt);font:600 .86rem var(--fb);padding:9px 4px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--sf2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln)}
.hero{display:grid;gap:10px;padding:2px}.hero h2{font-size:2.1rem}.cap{display:block}.cap::first-letter{text-transform:uppercase}
.stats.s3{grid-template-columns:repeat(3,1fr)}.stats.s3 .num{font-size:1.5rem}
.eyebrow{display:block;font:700 .7rem var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
.card.today{border-color:var(--ac)}.card.note2{border-color:var(--c1)}
h4{margin:6px 0 0;font-size:.76rem;color:var(--mt);text-transform:uppercase;letter-spacing:.07em}
.block{border-left:3px solid var(--ac);padding:10px 10px 10px 12px;background:var(--sf2);border-radius:0 12px 12px 0;display:grid;gap:8px}
.block.done{border-left-color:var(--ok)}
.bh{display:flex;align-items:center;gap:10px}.bt{flex:1;display:grid;gap:2px;min-width:0}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:1rem;flex:none;cursor:pointer}
.block.done .play{background:var(--ok);color:#06231a}
.slots{display:grid;gap:6px;border-top:1px dashed var(--ln);padding-top:8px}
.slot{display:flex;align-items:center;gap:6px}
.sln{flex:1;display:grid;gap:4px;background:none;border:0;color:var(--tx);text-align:left;font:500 .86rem var(--fb);cursor:pointer;padding:0;min-width:0}
.lvb{height:4px;background:var(--ln);border-radius:2px;overflow:hidden;display:block}.lvb i{display:block;height:100%;background:var(--c1)}
.lvn{font-size:.74rem;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:700 1rem var(--fb);cursor:pointer;flex:none}.ib:disabled{opacity:.3;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:12px 10px;color:var(--tx);text-align:left;display:grid;gap:3px;cursor:pointer;font:inherit;min-height:52px;align-content:center}.tile b{font-size:.9rem}.tile .mt{font-size:.76rem}
.tile.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,var(--sf2))}
.ed{display:grid;gap:8px;padding:4px 0}
.recs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.chip.rec{border-style:dashed;border-color:var(--c3);color:var(--c3);background:transparent}.why{flex-basis:100%;font-size:.78rem}
.wtxt{color:var(--am)}.dh{align-items:flex-start}
.tl{display:grid}.tli{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}.tli b{font-variant-numeric:tabular-nums}.tli.now b,.tli.now span{color:var(--ac);font-weight:700}
.stdrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}.stdrow div{display:grid;gap:2px}
.pfrow{display:flex;align-items:center;gap:8px}.pfrow input{flex:1;min-width:0}.pfrow.cur input{border-color:var(--ac)}
a.cal{text-align:left;font-weight:600}
main{padding-top:4px}
.pv{display:grid;gap:6px;width:100%}.pvl{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pvi{flex:none;width:96px;display:grid;gap:4px;justify-items:center;background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:6px;color:var(--tx);font:500 .74rem var(--fb);text-align:center;cursor:pointer}
.pvi svg.th{width:80px;height:70px}.noimg{width:80px;height:70px;display:grid;place-items:center;color:var(--mt);background:var(--sf);border-radius:8px}
.lgr{display:grid;gap:6px;padding:8px 0;border-bottom:1px solid var(--ln)}.lgn{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:end}
.btn.runall{background:var(--sf2);border:1px solid var(--ac);color:var(--tx)}
.pblk{border-left:3px solid var(--c1)}
#lgv{z-index:23}#xp{z-index:25}#xd{z-index:26}
.vbtn{display:grid;place-items:center;width:38px;height:38px}.vbtn.on{background:var(--ac);border-color:var(--ac);color:#fff}.hf{color:var(--c1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="ht"><h1>Calistenia <b>Comp</b></h1><span class="mt" id="hdr"></span></div><button class="avatar" id="avb" data-act="prof" aria-label="Perfil y ajustes">Y</button></header>
<main><div id="v"></div></main>

<nav class="tabs" aria-label="Secciones">
  <button data-act="tab" data-t="hoy"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Hoy</button>
  <button data-act="tab" data-t="plan"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</button>
  <button data-act="tab" data-t="train"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>Entrenar</button>
  <button data-act="tab" data-t="hist"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Progreso</button>
  <button data-act="tab" data-t="lib"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M19 19v2H6"/></svg>Ejercicios</button>
</nav>

<div id="pl" role="dialog" aria-modal="true" aria-label="Entrenamiento en curso">
  <div class="plh"><b id="plT"></b><span id="plHr" class="hrp" hidden></span><button class="ib vbtn" id="plV" data-act="vtog" aria-label="Voz del entrenador" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button><button class="btn sec sm" data-act="pl-x" aria-label="Cerrar">✕</button></div>
  <div id="plC"></div>
  <div class="plf">
    <div id="plStep"><button class="btn sec" data-act="pl-minus" aria-label="Restar una rep">−</button><div id="plVal">0</div><button class="btn sec" data-act="pl-plus" aria-label="Sumar una rep">+</button></div>
    <div id="plKgW" class="kgw"><button class="btn sec sm" data-act="kg-" aria-label="Restar 2,5 kg">−2,5</button><span id="plKg">Lastre +0 kg</span><button class="btn sec sm" data-act="kg+" aria-label="Sumar 2,5 kg">+2,5</button></div>
    <button class="btn" id="plBtn" data-act="pl-btn">EMPEZAR</button>
    <div id="plCtl"><button class="btn sec" data-act="pl-undo" id="plUndo">↶ Deshacer</button><button class="btn sec" data-act="pl-pause" id="plPause">❚❚ Pausa</button></div>
  </div>
</div>

<div class="ov" id="pf" role="dialog" aria-modal="true" aria-label="Perfil y ajustes"><div class="ovh"><b>Perfil y ajustes</b><button class="btn sec sm" data-act="pf-close" aria-label="Cerrar">✕</button></div><div class="ovc" id="pfC"></div><div></div></div>
<div class="ov" id="lgv" role="dialog" aria-modal="true" aria-label="Registrar entrenamiento"><div class="ovh"><b>Registrar entrenamiento</b><button class="btn sec sm" data-act="lg-close" aria-label="Cerrar">✕</button></div><div class="ovc" id="lgC"></div><div class="ovf" id="lgF"></div></div>
<div class="ov" id="xp" role="dialog" aria-modal="true" aria-label="Elegir ejercicios"><div class="ovh"><b>Agregar ejercicios</b><button class="btn sm" data-act="xp-close">Listo</button></div><div class="ovc" id="xpC"></div><div></div></div>
<div class="ov" id="xd" role="dialog" aria-modal="true" aria-label="Detalle del ejercicio"><div class="ovh"><b id="xdT"></b><button class="btn sec sm" data-act="xd-close" aria-label="Cerrar">✕</button></div><div class="ovc" id="xdC"></div><div class="ovf" id="xdF"></div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clone=o=>JSON.parse(JSON.stringify(o));
const isoLocal=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const KEY='cali_comp_v1';
const DEF={plans:[],ts:0,mh:[],bw:[],wk:null,lv:{},maxes:{pull:12,dips:20,push:35,squat:50,mu:5},start:isoLocal(new Date()),done:{},hist:[],pb:{},set:{snd:true,vib:true,cd:3,gh:'best',autolv:true,kgAll:false,age:0,hrmax:0,hrRest:0,rgoal:null,roff:0,rcomp:false,autoDeload:false,voice:false,vrate:1.05,vstrat:true,vghost:true,auto:false,pace:2.5,tapAny:false,vcmd:false}};
const PIDX='cali_profiles';let PROF=null;try{PROF=JSON.parse(localStorage.getItem(PIDX)||'null')}catch(e){}if(!PROF||!Array.isArray(PROF.list)||!PROF.list.length)PROF={list:[{id:'main',name:'Yo'}],cur:'main'};if(!PROF.list.some(p=>p.id===PROF.cur))PROF.cur=PROF.list[0].id;
const PKEY=pid=>pid==='main'?KEY:KEY+'_'+pid;
function normS(o){o=o||{};const s=Object.assign(clone(DEF),o);s.maxes=Object.assign({},DEF.maxes,o.maxes||{});s.set=Object.assign({},DEF.set,o.set||{});s.lv=Object.assign({},o.lv||{});s.hist=(s.hist||[]).filter(h=>h&&h.d);s.hist.forEach(h=>{if(!h.id)h.id='s'+Date.parse(h.d)});if(!Array.isArray(s.mh)||!s.mh.length)s.mh=[{d:isoLocal(new Date()),pull:s.maxes.pull,dips:s.maxes.dips,push:s.maxes.push,squat:s.maxes.squat}];if(!Array.isArray(s.bw))s.bw=[];s.ov=s.ov||{};return s}
function loadProf(pid){let o=null;try{o=JSON.parse(localStorage.getItem(PKEY(pid))||'null')}catch(e){}const s=normS(o);s.pid=pid;return s}
let S=loadProf(PROF.cur);
function save(sync){if(sync!==false)S.ts=Date.now();try{localStorage.setItem(PKEY(S.pid),JSON.stringify(S))}catch(e){}if(sync!==false&&typeof schedPush==='function')schedPush()}

const LBL={pull:'Dominadas',dips:'Fondos',push:'Flexiones',squat:'Sentadillas'};
const DAYN=['Lun','Mar','Jue','Sáb'];
const UI={tab:'hoy',wk:null,mode:'fortime',cmp:'piz',restMin:4,tx:{},pv:'gen',rid:'rr',lc:'Todas',lq:'',xd:null};
const st=(ex,reps,load)=>({ex,reps,load:load||''});
const lr=s=>`${s.ex} ${s.reps}${s.load?' ('+s.load+')':''}`;
const ft=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const ftd=s=>{const t=Math.round(Math.max(0,s)*10)/10,m=Math.floor(t/60);return m+':'+(t-m*60).toFixed(1).padStart(4,'0')};

function typ(n){n=(n||'').toLowerCase();if(/pull|domin|chin/.test(n))return'pull';if(/dip|fondo/.test(n))return'dips';if(/push|flex/.test(n))return'push';if(/sentad|squat/.test(n))return'squat';return''}
function split(n,c){if(n<=c)return[n];const k=Math.ceil(n/c),b=Math.floor(n/k),r=n%k;return Array.from({length:k},(_,i)=>b+(i<r?1:0))}
const RAT={pull:.55,dips:.65,push:.6,squat:1};
function strat(steps){const seen={};return steps.map(s=>{const t=typ(s.ex);if(!t||!s.reps)return'';const k=seen[t]=(seen[t]||0)+1;const cap=Math.max(3,Math.round(S.maxes[t]*RAT[t]*Math.pow(.9,k-1)*(s.load?.75:1)));const p=split(s.reps,cap);return p.length>1?p.join(' + '):'Sin cortar'})}

    [st('Dips',15),st('Pull up',5),st('Push up',20),st('Sentadilla',20),st('Dips',10),st('Pull up',10),st('Push up',20),st('Sentadilla',20),st('Dips',5),st('Pull up',15)]]},

function pyrSteps(a,b,mult,peak,step){const up=[];for(let r=step;r<=peak;r+=step)up.push(r);if(!up.length)up.push(peak);const seq=up.concat(up.slice(0,-1).reverse());const out=[];seq.forEach(r=>{out.push(st(a,r));if(b)out.push(st(b,r*mult))});return out}

function buildPlan(){
  const m=S.maxes,P=m.pull,D=m.dips,U=m.push,Q=m.squat,R=x=>Math.max(1,Math.round(x)),C=COMP.piz.r;
  const warm={k:'note',text:'Entrada en calor 8-10 min: movilidad de hombro y muñeca, 2×10 retracción escapular colgado, 2 series al 30% de dominadas y fondos.'};
  const sim=(ri,t)=>({k:'time',title:t||`Simulación Ronda ${ri+1}`,rounds:[C[ri]],rest:0,pb:t?[]:[`piz-${ri+1}`]});
  const full=rest=>({k:'time',title:'Simulación completa 3 rondas',rounds:C,rest,pb:['piz-1','piz-2','piz-3']});
  const note=t=>({k:'note',text:t});
  const iso={k:'int',title:'Isométricos',work:30,rest:30,rounds:2,items:[{ex:'Dead hang'},{ex:'Hollow hold'},{ex:'Plancha'},{ex:'L-sit',secs:15}]};
  const W=[];
  for(let w=1;w<=8;w++){
    let ph,goal,days;
    if(w<=3){
      const f=1+.1*(w-1);ph='Base · capacidad de trabajo';
      goal='Volumen submáximo (40-60% del máximo) sin llegar al fallo, más lastre para crear reserva de fuerza. Opcional, lunes a viernes: 4-6 series de dominadas al 30-40% repartidas en el día (grease the groove).';
      days=[
        {t:'Tracción: fuerza + volumen',b:[warm,
          {k:'sets',title:'Dominada lastrada',items:[{ex:'Pull up',reps:R(P*.35),load:'+5-10kg'}],sets:5,rest:150},
          {k:'emom',title:'EMOM dominadas submáximas',min:10,items:[{ex:'Pull up',reps:R(P*.4*f)}]},
          {k:'sets',title:'Australianas',items:[{ex:'Australianas',reps:12}],sets:3,rest:60},
          {k:'int',title:'Agarre: dead hang',work:40,rest:40,rounds:3,items:[{ex:'Dead hang'}]}]},
        {t:'Empuje + piernas',b:[warm,
          {k:'sets',title:'Fondos lastrados',items:[{ex:'Dips',reps:R(D*.3),load:'+10kg'}],sets:5,rest:120},
          {k:'emom',title:'EMOM fondos / flexiones',min:12,items:[{ex:'Dips',reps:R(D*.45*f)},{ex:'Push up',reps:R(U*.45*f)}]},
          {k:'sets',title:'Sentadilla a ritmo',items:[{ex:'Sentadilla',reps:R(Q*.6*f)}],sets:4,rest:60},
          {k:'int',title:'Core: L-sit',work:15,rest:30,rounds:5,items:[{ex:'L-sit'}]}]},
        {t:'Densidad mixta',b:[warm,
          {k:'time',title:'Pirámide dominadas / fondos',rounds:[pyrSteps('Pull up','Dips',2,R(P*.4),1)],rest:0},
          {k:'amrap',title:'AMRAP 12 min',min:12,steps:[st('Pull up',R(P*.3)),st('Dips',R(D*.4)),st('Push up',R(U*.4)),st('Sentadilla',R(15*f))]},
          {k:'int',title:'Tabata jump squats',work:20,rest:10,rounds:8,items:[{ex:'Jump squats'}]}]},
        {t:'Simulación',b:[warm].concat(w===1?[sim(0)]:w===2?[sim(0),note('Descanso 5 min.'),sim(1)]:[sim(1),note('Descanso 5 min.'),sim(2)],[note('Revisá los parciales en Historial: identificá en qué estación se te va el tiempo.')])}
      ];
    }else if(w===4){
      ph='Test + descarga';goal='Medir y descargar. El test actualiza tus máximos y recalcula solo las semanas 5 a 8.';
      days=[
        {t:'Test de máximos',b:[warm,{k:'sets',test:true,title:'Test al fallo (1 serie c/u)',items:['Pull up','Dips','Push up','Sentadilla'].map(e=>({ex:e,reps:'max'})),sets:1,rest:240},note('Reps estrictas con el estándar de competencia. Registrá exactamente lo hecho.')]},
        {t:'Técnica + movilidad',b:[{k:'emom',title:'EMOM técnica',min:10,items:[{ex:'Pull up',reps:R(P*.3)},{ex:'Dips',reps:R(D*.3)}]},iso]},
        {t:'Simulación Ronda 1',b:[warm,sim(0)]}
      ];
    }else if(w<=6){
      const f=w===5?1:1.1;ph='Específico · densidad competitiva';
      goal='Bloques reales de las rondas con descansos cortos. Ensayá la partición de series de la pestaña Competir hasta que sea automática.';
      days=[
        {t:'Tracción específica R2',b:[warm,
          {k:'sets',title:'Dominada lastrada',items:[{ex:'Pull up',reps:R(P*.3),load:'+10-15kg'}],sets:5,rest:180},
          (()=>{const r=C[1].slice(0,5);return{k:'time',title:'Bloque tracción R2',rounds:w===5?[r,r]:[r,r,r],rest:180}})(),
          {k:'sets',title:'Australianas',items:[{ex:'Australianas',reps:15}],sets:3,rest:60}]},
        {t:'Motor: EMOM 4 estaciones',b:[warm,
          {k:'emom',title:'EMOM 4 estaciones',min:16,items:[{ex:'Pull up',reps:R(P*.35*f)},{ex:'Dips',reps:R(D*.5*f)},{ex:'Push up',reps:R(U*.5*f)},{ex:'Sentadilla',reps:R(Q*.45*f)}]},
          {k:'int',title:'Tabata flexiones / jump squats',work:20,rest:10,rounds:4,items:[{ex:'Push up'},{ex:'Jump squats'}]}]},
        {t:'Rondas partidas',b:[warm,
          (()=>{const r=C[2].slice(0,5);return{k:'time',title:'R3 primera mitad',rounds:[r,r,r],rest:120}})(),
          note('Descanso 4 min.'),
          (()=>{const r=C[2].slice(5);return{k:'time',title:'R3 segunda mitad',rounds:[r,r],rest:120}})()]},
        {t:'Simulación completa',b:[warm,full(w===5?300:240),note('Descanso entre rondas: 5 min (S5) y 4 min (S6).')]}
      ];
    }else if(w===7){
      ph='Pico · intensidad máxima';goal='Intensidad alta, volumen moderado. Ensayo general con el horario y el calentamiento de la competencia.';
      days=[
        {t:'Fuerza máxima',b:[warm,
          {k:'sets',title:'Dominada lastrada pesada',items:[{ex:'Pull up',reps:3,load:'+15-20kg'}],sets:4,rest:180},
          {k:'sets',title:'Fondos lastrados pesados',items:[{ex:'Dips',reps:5,load:'+20kg'}],sets:4,rest:150},
          {k:'emom',title:'EMOM dominadas',min:8,items:[{ex:'Pull up',reps:R(P*.45)}]}]},
        {t:'Simulación R2 + R3',b:[warm,sim(1),note('Descanso 4 min.'),sim(2)]},
        {t:'Recuperación activa',b:[note('20 min de movilidad o bici suave. Sin fallo.'),iso]},
        {t:'Ensayo general',b:[warm,full(240),note('Mismo horario, calentamiento y descansos que el día de la competencia.')]}
      ];
    }else{
      ph='Taper · llegar fresco';goal='Volumen −50%, intensidad sostenida. Priorizá sueño e hidratos 24-48 h antes. Nada nuevo.';
      days=[
        {t:'Activación',b:[warm,{k:'emom',title:'EMOM activación',min:10,items:[{ex:'Pull up',reps:R(P*.3)},{ex:'Dips',reps:R(D*.35)}]},{k:'sets',title:'Flexiones',items:[{ex:'Push up',reps:R(U*.4)}]
          ,sets:2,rest:90}]},
        {t:'Ritmo R1',b:[warm,sim(0,'R1 al 85% (ritmo, no máximo)')]},
        {t:'Descanso',b:[note('Descanso total o 15 min de movilidad. Prepará magnesio, cinturón y ropa.')]},
        {t:'COMPETENCIA',b:[note('Calentamiento pre-competencia (pestaña Entrenar) que termine 5-8 min antes. Repasá la estrategia de cada ronda.'),full(240)]}
      ];
    }
    W.push({ph,goal,days});
  }
  return W;
}

const G=132,SEG={t:34,ua:18,fa:17.5,th:24,sh:24,ft:7,hd:6.5,nk:3.5},RD=Math.PI/180;
const mv=(p,a,l)=>[p[0]+Math.cos(a*RD)*l,p[1]+Math.sin(a*RD)*l];
function ik(a,b,l1,l2,s){const dx=b[0]-a[0],dy=b[1]-a[1];let d=Math.hypot(dx,dy)||.01;const an=Math.atan2(dy,dx);if(d>=l1+l2)return[a[0]+Math.cos(an)*l1,a[1]+Math.sin(an)*l1];d=Math.max(d,Math.abs(l1-l2)+.01);const c=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));return[a[0]+Math.cos(an+s*c)*l1,a[1]+Math.sin(an+s*c)*l1]}
function skel(p){
  const H=[0,0],S=mv(H,p.t,SEG.t),Hd=mv(S,p.t+(p.hn||0),SEG.nk+SEG.hd);
  const arm=(ua,fa)=>{const E=mv(S,ua,SEG.ua);return[E,mv(E,fa,SEG.fa)]};
  const leg=(th,sh,ft)=>{const K=mv(H,th,SEG.th),A=mv(K,sh,SEG.sh);return[K,A,mv(A,ft==null?sh-90:ft,SEG.ft)]};
  const J={H,S,Hd};
  [J.E,J.Hn]=arm(p.ua??90,p.fa??90);[J.K,J.A,J.T]=leg(p.th??90,p.sh??90,p.ft);
  if(p.ua2!=null)[J.E2,J.Hn2]=arm(p.ua2,p.fa2);else{J.E2=J.E;J.Hn2=J.Hn}
  if(p.th2!=null)[J.K2,J.A2,J.T2]=leg(p.th2,p.sh2,p.ft2);else{J.K2=J.K;J.A2=J.A;J.T2=J.T}
  const anc=J[p.an||'Hn'],at=p.at||[80,G],ox=at[0]-anc[0],oy=at[1]-anc[1];
  for(const k in J)J[k]=[J[k][0]+ox,J[k][1]+oy];
  if(p.hk){J.E=ik(J.S,p.hk,SEG.ua,SEG.fa,p.hb??1);J.Hn=p.hk.slice();if(p.ua2==null&&!p.hk2){J.E2=J.E;J.Hn2=J.Hn}}
  if(p.hk2){J.E2=ik(J.S,p.hk2,SEG.ua,SEG.fa,p.hb2??p.hb??1);J.Hn2=p.hk2.slice()}
  if(p.fk){J.K=ik(J.H,p.fk,SEG.th,SEG.sh,p.kb??-1);J.A=p.fk.slice();J.T=mv(J.A,p.ft??0,SEG.ft);if(p.th2==null&&!p.fk2){J.K2=J.K;J.A2=J.A;J.T2=J.T}}

const BL=[];
function reg(b){BL.push(b);return BL.length-1}
function descOld(b){
  switch(b.k){
    case'sets':return b.items.map(i=>`${i.ex} ${b.sets}×${i.reps==='max'?'máx':i.reps}${i.load?' '+i.load:''}`).join(' · ')+` · desc. ${b.rest}s`;
    case'time':{const same=b.rounds.every(r=>r===b.rounds[0]);const tot=b.rounds.reduce((a,r)=>a+r.reduce((x,s)=>x+(+s.reps||0),0),0);
      return(b.rounds.length>1?`${b.rounds.length} rondas${same?'':' distintas'}: `:'')+(same?b.rounds[0].map(lr).join(' → '):`${tot} reps totales`)+(b.rest&&b.rounds.length>1?` · desc. ${b.rest}s entre rondas`:'')+' · por tiempo'}
    case'emom':return(b.int?`Cada ${b.int} s · ${b.min} min: `:`EMOM ${b.min} min: `)+(b.ladder?`${b.items[0].ex} desde ${b.items[0].reps} (+${(b.items[1]?b.items[1].reps:b.items[0].reps)-b.items[0].reps}/min)`:b.items.map(lr).join(' / '));
    case'amrap':return`AMRAP ${b.min} min: `+b.steps.map(lr).join(' → ');
    case'stop':return'Cronómetro libre con vueltas';
    case'int':if(b.seq)return`${b.seq.length} intervalos · ${ft(b.seq.reduce((a,x)=>a+x.dur,0))} en total`;return`${b.rounds}× [${b.items.map(i=>`${i.ex} ${i.secs||b.work}s`).join(', ')}] · desc. ${b.rest}s`;
  }return''}
function blk(b,ref){
  if(b.k==='note')return`<div class="block note mt">${b.text}</div>`;
  const id=reg(Object.assign({},b,{ref}));const done=ref&&isDone(S.done[ref]);
  return`<div class="block"><div class="row sb"><b>${b.title}</b><button class="btn sm${done?' sec':''}" data-act="run" data-b="${id}">${done?'✓ Repetir':'▶ Iniciar'}</button></div><span class="mt">${desc(b)}</span></div>`}

function curWeek(){const d=Math.floor((Date.parse(isoLocal(new Date()))-Date.parse(S.start))/864e5);return Math.min(8,Math.max(1,Math.floor(d/7)+1))}

  <div class="row"><span class="pill ac">Semana ${wk}${wk===cw?' · actual':''}</span><span class="mt">${W.ph}</span></div><p class="mt">${W.goal}</p></div>`;
  W.days.forEach((d,di)=>{
    const key=`w${wk}d${di}`,run=d.b.map((b,bi)=>b.k==='note'?-1:bi).filter(x=>x>=0),nd=run.filter(bi=>S.done[key+'b'+bi]).length;

function resolve(sp,ctx){ctx=ctx||{goal:S.set.rgoal||null,off:S.set.roff||0};const g=ctx.goal&&!sp.keep?GP[ctx.goal]:null,A=painAdj();
  const ex=(f,fix)=>{const L=FAM[f].lv;const i=fix!=null?Math.min(fix,L.length-1):Math.max(0,Math.min(L.length-1,lvOf(f)+(ctx.off||0)));let e=L[i];if(A.noLoad&&/lastr/i.test(e.n)&&i>0)e=L[i-1];return e};
  if(sp.r==='note')return[{k:'note',text:sp.text}];
  if(sp.r==='hold'){if(A.noStraight&&STRAIGHT.includes(sp.f))return[{k:'note',text:`${sp.title}: omitido por molestia (brazos rectos).`}];const e=ex(sp.f,sp.fix),fa=famFactor(sp.f,A);return[{k:'int',title:`${sp.title}: ${e.n}`,work:g?g.hs:sp.secs,rest:g?g.hrest:sp.rest,rounds:Math.max(1,Math.round((g?g.hr:sp.rounds)*fa)),items:[{ex:e.n}]}]}
  if(sp.r==='sets'){const reps=[],holds=[];let fa=1;sp.items.forEach(([f,n,fix])=>{fa=Math.min(fa,famFactor(f,A));const e=ex(f,fix),nn=g&&n!=='max'?g.reps:n;(e.u==='s'?holds:reps).push({ex:e.n,reps:nn,secs:g?g.hs:(n>=10?n:20),load:/lastr/i.test(e.n)?'+lastre':''})});
    const sets=Math.max(1,Math.round((g?g.sets:sp.sets)*fa)),rest=g?g.rest:sp.rest,out=[];
    if(reps.length)out.push({k:'sets',title:sp.title,items:reps.map(x=>({ex:x.ex,reps:x.reps,load:x.load})),sets,rest,alt:sp.alt&&reps.length>1});
    if(holds.length)out.push({k:'int',title:sp.title+(reps.length?' · isométricos':''),work:20,rest:Math.min(rest,60)||30,rounds:sets,items:holds.map(x=>({ex:x.ex,secs:x.secs}))});
    return out}
  const b=clone(sp.b);const fx=it=>{if(it.f){const e=ex(it.f,it.fix);it.ex=e.n;delete it.f;delete it.fix}return it};
  if(b.items)b.items=b.items.map(fx);if(b.steps)b.steps=b.steps.map(fx);if(Array.isArray(b.rounds))b.rounds=b.rounds.map(r=>Array.isArray(r)?r.map(fx):r);return[b]}

  if(b.k==='time'){const cum=[];g.sp.reduce((a,x,i)=>(cum[i]=a+x),0);return Object.assign({},g,{cum})}return g}
const dm=iso=>new Date(iso).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});

function ghostRun(e){const b=P.b,g=P.gh;if(!g)return'';

    <div class="ghd">${diff==null?`Fantasma en: ${gname}`:`<b class="${diff<=0?'up':'dn'}">${diff<=0?'−':'+'}${Math.abs(diff).toFixed(1)} s</b> vs fantasma · va en ${gname}`}</div></div>`}
  if(b.k==='sets'&&P.sub==='work'&&g.log){const s=P.seq[P.i],gl=g.log.find(l=>l[0]===s.ex&&l[1]===s.s);return gl?`<div class="ghd">Fantasma (${dm(g.d)}): ${gl[2]} reps${gl[4]?' con +'+gl[4]+' kg':''} en esta serie</div>`:''}

function analyze(){
  const H=S.hist.slice().sort((a,b)=>a.d<b.d?-1:1),now=Date.now(),A={};
  const wk=t=>wkOf(isoLocal(new Date(t)));

  const weeks=[];for(let i=7;i>=0;i--){const d=new Date(now-i*7*DAY);weeks.push(wkOf(isoLocal(d)))}

    if(!bw||!(k==='pull'||k==='dips')||!d||d>12)return;const v=e1rm(bw+kg,d);if(!best[k]||v>best[k])best[k]=v});Object.entries(best).forEach(([k,v])=>ser[k].push([Date.parse(h.d),Math.round(v*10)/10]))});return{ser,rec}}

function parseLines(t){
  return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    let load='',mult=1,secs=0,reps=0;
    l=l.replace(/\s*([+-]\s*\d+(?:[.,]\d+)?\s*kg)/i,(m,a)=>{load=a.replace(/\s/g,'');return''});
    l=l.replace(/\s+x(\d+)\s*$/i,(m,a)=>{mult=+a;return''});
    l=l.replace(/\s+(\d+)\s*s(eg)?\s*$/i,(m,a)=>{secs=+a;return''});
    l=l.replace(/\s+(\d+)\s*$/,(m,a)=>{reps=+a;return''});
    return{ex:l.trim()||'Ejercicio',reps,secs,load,mult}})}

function build(){
  const m=UI.mode,M=MODES[m],tx=$('#ftx').value;UI.tx[m]=tx;

  const v={};M.f.forEach(f=>v[f]=Math.max(0,+$('#f_'+f).value||0));
  const steps=it.map(i=>st(i.ex,i.reps||10,i.load));let b;
  {const xb=buildExtra(m,v,it);if(xb)return openPlayer(xb)}
  switch(m){
    case'series':b={k:'sets',title:'Series',items:it.map(i=>({ex:i.ex,reps:i.reps||'max',load:i.load})),sets:Math.max(1,v.sets),rest:v.rest};break;
    case'fortime':b={k:'time',title:'For Time',rounds:Array.from({length:Math.max(1,v.rounds)},()=>steps),rest:v.rest};break;
    case'emom':b={k:'emom',title:'EMOM',min:Math.max(1,v.min),items:it.map(i=>({ex:i.ex,reps:i.reps||'',load:i.load}))};break;
    case'amrap':b={k:'amrap',title:'AMRAP',min:Math.max(1,v.min),steps};break;
    case'tabata':b={k:'int',title:'Tabata / HIIT',work:Math.max(5,v.work),rest:v.rest2,rounds:Math.max(1,v.rounds),items:it.map(i=>({ex:i.ex,secs:i.secs}))};break;
    case'iso':b={k:'int',title:'Isométricos',work:30,rest:v.rest2,rounds:Math.max(1,v.rounds),items:it.map(i=>({ex:i.ex,secs:i.secs||30}))};break;
    case'pyr':{const a=it[0],c=it[1];b={k:'time',title:`Pirámide ${a.ex}${c?' / '+c.ex:''}`,rounds:[pyrSteps(a.ex,c&&c.ex,c?c.mult:1,Math.max(1,v.peak),Math.max(1,v.stepv))],rest:0};break}
    case'ladder':{const n=Math.max(2,v.min);b={k:'emom',title:`Escalera ${it[0].ex}`,ladder:true,min:n,items:Array.from({length:n},(_,i)=>({ex:it[0].ex,reps:v.startv+i*v.inc}))};break}
    case'test':b={k:'sets',test:true,title:'Test de máximos',items:it.map(i=>({ex:i.ex,reps:'max'})),sets:1,rest:v.rest};break}
  openPlayer(b)}

function beep(f,d,v){if(!S.set.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=(v==null?.25:v)*.4;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function vib(p){if(!S.set.vib)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&P.b&&(P.ph==='run'||P.ph==='cd'))wake(true)});

function el(){return((P.paused?P.pAt:now())-P.t0-P.pAcc)/1000}
function Wt(){const e=el();return e-P.rAcc-(P.inRest?e-P.rSt:0)}
function tgt(s){return s.reps==='max'?((P.mx||S.maxes)[typ(s.ex)]||10):s.reps}

function openPlayer(b){
  Object.keys(P).forEach(k=>delete P[k]);
  Object.assign(P,{b,ph:'ready',paused:false,pAcc:0,i:0,log:[],splits:[],rt:[],rAcc:0,inRest:false,idx:0,lb:0,lm:-1,val:0,emd:{},hr:[],hrT:0,lvups:[],kg:0,laps:[],lapSt:0,skip:0});P.gh=ghostFor(b);
  if(b.k==='time'){P.seq=[];b.rounds.forEach((r,ri)=>{const sg=strat(r);r.forEach((s,si)=>P.seq.push(Object.assign({},s,{ri,sg:sg[si]})));if(ri<b.rounds.length-1&&b.rest)P.seq.push({rest:b.rest,ri})})}
  if(b.k==='sets'){P.seq=[];if(b.alt){for(let s=1;s<=b.sets;s++)b.items.forEach(it=>P.seq.push(Object.assign({},it,{s,of:b.sets})))}else b.items.forEach(it=>{for(let s=1;s<=b.sets;s++)P.seq.push(Object.assign({},it,{s,of:b.sets}))})}
  if(b.k==='int'){if(b.seq)P.seq=clone(b.seq);else{P.seq=[];for(let r=1;r<=b.rounds;r++)b.items.forEach(it=>{P.seq.push({ex:it.ex,dur:it.secs||b.work,r,rest:it.rest?1:0});if(b.rest)P.seq.push({ex:'Descanso',dur:b.rest,rest:1,r})});if(P.seq.length>1&&P.seq[P.seq.length-1].rest)P.seq.pop()}}
  P.nr=(P.seq||[]).filter(x=>!x.rest);$('#pl').classList.add('on');$('#plT').textContent=b.title;document.body.style.overflow='hidden';
  clearInterval(TK);TK=setInterval(tick,100);draw()}

function startCd(){beep(1,.01,0);wake(true);if(!S.set.cd)return go();P.ph='cd';P.cdEnd=now()+S.set.cd*1000;P.lb=-1;draw()}
function go(){
  P.ph='run';P.t0=now();beep(1320,.35);vib(200);const b=P.b;
  if(b.k==='time'){P.stepSt=0;P.roundSt=0}
  if(b.k==='sets'&&wantsKg(P.seq[0]))P.kg=inProf(P.who,()=>lastKg(P.seq[0].ex,P.seq[0].load));
  if(b.k==='stop'){P.laps=[];P.lapSt=0}
  if(b.k==='sets'){P.sub='work';P.val=tgt(P.seq[0])}
  if(b.k==='int'){P.phEnd=P.seq[0].dur}
  draw()}
function cdb(r){const s=Math.ceil(r);if(s<=3&&s>0&&s!==P.lb){P.lb=s;beep(660,.12)}}

function tick(){
  const b=P.b;if(!b)return;
  if(P.ph==='cd'){const r=(P.cdEnd-now())/1000;if(r<=0)return go();const s=Math.ceil(r);if(s!==P.lb){P.lb=s;beep(660,.12)}return draw()}
  if(P.ph!=='run'||P.paused)return;
  const e=el();if(HR.bpm&&now()-(P.hrT||0)>1000){P.hr.push(HR.bpm);P.hrT=now()}
  if(b.k==='time'){const s=P.seq[P.i];if(s&&s.rest){const r=P.rSt+s.rest-e;cdb(r);if(r<=0)return adv()}}
  else if(b.k==='sets'){if(P.sub==='rest'){const r=P.restEnd-e;cdb(r);const hk=S.set.hrRest>0&&HR.bpm&&HR.bpm<=S.set.hrRest&&e-(P.restSt||0)>=20;if(r<=0||hk){P.sub='work';beep(1320,.3);vib([150,80,150]);if(hk&&r>0)toast('Pulso recuperado: a la próxima serie')}}}
  else if(b.k==='emom'){if(e>=b.min*60)return finish();const m=Math.floor(e/IV(b));if(m!==P.lm){if(P.lm>=0){beep(1320,.3);vib(200)}P.lm=m;P.lb=0}cdb(IV(b)-e%IV(b))}
  else if(b.k==='amrap'){const r=b.min*60-e;cdb(r);if(r<=0)return finish()}
  else if(b.k==='int'){const r=P.phEnd-e;cdb(r);if(r<=0)return intAdv()}
  draw()}

function adv(){
  const b=P.b;
  if(b.k==='time'){
    const s=P.seq[P.i];
    if(s.rest){P.rAcc+=el()-P.rSt;P.inRest=false;P.roundSt=Wt()}
    else P.splits.push({ex:s.ex,reps:s.reps,ri:s.ri,t:Wt()-P.stepSt});
    P.i++;const n=P.seq[P.i];
    if(!s.rest&&(!n||n.rest||n.ri!==s.ri))P.rt.push(Wt()-P.roundSt);
    if(!n)return finish();
    if(n.rest){P.inRest=true;P.rSt=el();P.lb=0;beep(440,.3);vib(300)}
    else{if(!s.rest&&n.ri!==s.ri)P.roundSt=Wt();beep(990,.06)}
    P.stepSt=Wt()}
  else if(b.k==='amrap'){P.idx++;beep(990,.06)}
  else if(b.k==='emom'){const m=Math.floor(el()/IV(b));if(P.emd[m]==null){P.emd[m]=el()%IV(b);beep(990,.06)}}
  else if(b.k==='sets'){
    if(P.sub==='rest'){P.sub='work';return draw()}
    const s=P.seq[P.i];P.log.push({ex:s.ex,s:s.s,t:tgt(s),d:P.val,kg:wantsKg(s)?P.kg:0});
    if(b.test){const k=typ(s.ex);if(k&&P.val>0){if(P.who&&P.who!==S.pid)(P.tmax=P.tmax||{})[k]=P.val;else{S.maxes[k]=P.val;recordMax();save()}}}
    P.i++;if(P.i>=P.seq.length)return finish();
    {const nx=P.seq[P.i];P.val=tgt(nx);if(nx.ex!==s.ex)P.kg=wantsKg(nx)?inProf(P.who,()=>lastKg(nx.ex,nx.load)):0;const ra=restAfter(b,s,nx);if(ra>0){P.sub='rest';P.restSt=el();P.restEnd=el()+ra;P.lb=0;beep(440,.2)}else{P.sub='work';beep(990,.08)}}}
  else if(b.k==='int'){const s=P.seq[P.i];if(s&&!s.rest&&P.phEnd-el()>1)P.skip=1;return intAdv()}
  else if(b.k==='stop'){P.laps.push(el()-P.lapSt);P.lapSt=el();beep(990,.06)}
  draw()}
function intAdv(){P.i++;if(P.i>=P.seq.length)return finish();const s=P.seq[P.i];P.phEnd=el()+s.dur;P.lb=0;beep(s.rest?440:1320,.3);vib(s.rest?100:[100,60,100]);draw()}
function undo(){
  const b=P.b;if(P.ph!=='run')return;if(b.k==='stop')return finish();
  if(b.k==='time'){const pv=P.seq[P.i-1],cu=P.seq[P.i];if(!pv||pv.rest||!cu||cu.rest||pv.ri!==cu.ri)return toast('No se puede deshacer aquí');const sp=P.splits.pop();P.i--;P.stepSt-=sp.t}
  else if(b.k==='amrap'){if(P.idx>0)P.idx--}
  else if(b.k==='emom'){const m=Math.floor(el()/IV(b));delete P.emd[m]}
  draw()}
function pause(){if(P.ph!=='run')return;if(!P.paused){P.paused=true;P.pAt=now()}else{P.pAcc+=now()-P.pAt;P.paused=false}draw()}

function finish(){
  const b=P.b;if(P.ph==='end')return;const _me=S;if(P.who&&P.who!==S.pid)S=loadProf(P.who);if(P.tmax){Object.assign(S.maxes,P.tmax);recordMax()}const dur=el();P.ph='end';clearInterval(TK);wake(false);
  beep(1320,.2);setTimeout(()=>beep(1760,.4),230);vib([200,100,400]);
  let sum='',det='';const pbs=[];
  if(b.k==='time'){
    const tot=P.rt.reduce((a,x)=>a+x,0);
    sum=`Tiempo ${ftd(tot)}`+(P.rt.length>1?` · rondas ${P.rt.map(ftd).join(' / ')}`:'');
    (b.pb||[]).forEach((k,ri)=>{const t=P.rt[ri];if(t==null)return;const o=S.pb[k]||(S.pb[k]={best:null,last:[]});const v=+t.toFixed(1);o.last.unshift(v);o.last=o.last.slice(0,10);if(o.best==null||v<o.best){o.best=v;pbs.push(k)}});
    det=P.splits.map(x=>`R${x.ri+1} ${x.ex} ${x.reps}: ${x.t.toFixed(1)} s (${(x.t/x.reps).toFixed(2)} s/rep)`).join('\n')}
  if(b.k==='sets'){sum=P.log.map(l=>`${l.ex} S${l.s}: ${l.d}${l.t?'/'+l.t:''}${l.kg?' +'+l.kg+'kg':''}`).join(' · ')+(b.test?' · máximos actualizados':'')}
  if(b.k==='amrap'){const n=b.steps.length,r=Math.floor(P.idx/n),rem=P.idx%n,reps=b.steps.slice(0,rem).reduce((a,s)=>a+(+s.reps||0),0);sum=`${r} rondas + ${reps} reps`}
  if(b.k==='emom'){const v=Object.values(P.emd);sum=`${Math.min(b.min,Math.floor(dur/60))} de ${b.min} min`+(v.length?` · uso medio ${(v.reduce((a,x)=>a+x,0)/v.length).toFixed(0)} s/min`:'')+(b.ladder?` · última completada: ${v.length?b.items[Math.max(...Object.keys(P.emd).map(Number))].reps:0} reps`:'')}
  if(b.k==='int'){sum=b.seq?`${P.seq.length} intervalos`:`${b.rounds} rondas completas`}
  if(b.k==='stop'){sum=`${ftd(dur)} · ${P.laps.length} vueltas`;det=P.laps.map((x,i)=>`V${i+1}: ${ftd(x)}`).join('\n')}
  const ent={id:'s'+Date.now(),d:new Date().toISOString(),t:b.title,k:b.k,dur:+dur.toFixed(1),sum,det,sig:sigOf(b),vol:volOf(b)};
  if(b.k==='time'){ent.sp=P.splits.map(x=>+x.t.toFixed(2));ent.st=P.splits.map(x=>[x.ex,x.reps,x.ri]);ent.rt=P.rt.map(x=>+x.toFixed(1));ent.tot=+P.rt.reduce((a,x)=>a+x,0).toFixed(1);if(b.pb&&b.pb.length)ent.pbk=b.pb.slice()}
  if(b.k==='sets')ent.log=P.log.map(l=>[l.ex,l.s,l.d,l.t,l.kg||0]);
  if(b.k==='amrap'){const n=b.steps.length;let sc=0;for(let i=0;i<P.idx;i++)sc+=+b.steps[i%n].reps||0;ent.sc=sc}
  if(P.gh&&b.k==='time'&&P.gh.tot!=null)ent.gd=+(ent.tot-P.gh.tot).toFixed(1);
  if(P.hr&&P.hr.length){ent.hrAvg=Math.round(P.hr.reduce((a,x)=>a+x,0)/P.hr.length);ent.hrMax=Math.max(...P.hr);ent.sum+=` · FC media ${ent.hrAvg} (máx ${ent.hrMax})`}
  P.lvups=autoLevel(b);if(P.lvups.length)ent.lvup=P.lvups.map(x=>x.to);
  S.hist.unshift(ent);S.hist=S.hist.slice(0,500);P.ent=ent;cloudSession(ent);
  if(b.ref)S.done[b.ref]=b.ref.startsWith('r-')?isoLocal(new Date()):1;save();P.res={sum:P.ent?P.ent.sum:sum,pbs};P.entPid=S.pid;S=_me;draw()}

  Object.keys(COMP).flatMap(c=>COMP[c].r.map((_,i)=>c+'-'+(i+1))).forEach(k=>{const pts=H.filter(h=>h.pbk&&h.rt&&h.pbk.includes(k)).map(h=>h.rt[h.pbk.indexOf(k)]).filter(x=>x!=null);if(pts.length>=4){const best=Math.min(...pts.slice(2));if(pts.slice(0,2).every(x=>x>best*1.05))why.push(`Tus 2 últimas simulaciones de ${k.replace('piz-','R').replace('og-','Off Gravity R').replace('adv-','Avanzado R')} fueron más de 5% más lentas que tu mejor marca`)}});
  const A=analyze();if(A.acwr!=null&&A.acwr>1.5)why.push('Subida brusca de volumen esta semana');if(painAdj().any)why.push('Molestias registradas en los últimos días');
  const since=S.dlLast?(Date.parse(thisWk())-Date.parse(S.dlLast))/(7*DAY):99;if(A.streak>=5&&since>=5)why.push(`${A.streak} semanas seguidas entrenando sin descarga`);
  return{why,rec:why.length>=2||(why.length===1&&A.streak>=4),since}}
function autoDeloadCheck(){if(!S.set.autoDeload||deloadOn()||S.dlSkip===thisWk())return;const i=deloadInfo();if(i.rec&&i.since>=3){S.deload=thisWk();S.dlLast=thisWk();save();toast('Se activó una semana de descarga')}}

  const i=deloadInfo();if(!i.rec)return'';return`<div class="card warn"><div class="row sb"><b>Te conviene una semana de descarga</b><button class="btn sm" data-act="dlon">Aplicar</button></div><ul class="tips">${i.why.map(x=>`<li>${x}</li>`).join('')}</ul></div>`}

let WAC=null;
function weekAdapt(){if(WAC&&WAC.t===S.ts&&WAC.p===S.pid&&WAC.d===isoLocal(new Date()))return WAC.v;const mw=myWeek(),res={f:{},why:[],pend:[],done:{pull:0,push:0,legs:0},plan:{pull:0,push:0,legs:0}};
  if(mw){const today=(new Date().getDay()+6)%7,w=thisWk(),now=Date.now(),recent={};
    S.hist.forEach(h=>{if(!h.vol)return;const age=(now-Date.parse(h.d))/36e5;Object.entries(h.vol).forEach(([k,v])=>{const g=vgrp(k);if(!g)return;if(wkOf(isoLocal(new Date(h.d)))===w)res.done[g]+=v;if(age>=0&&age<36)recent[g]=(recent[g]||0)+v})});
    const rem={};mw.days.forEach(d=>{const pv=plannedVol(d),dn=dayDoneN(d);Object.keys(res.plan).forEach(g=>res.plan[g]+=pv[g]);if(d.wd>=today&&dn.n<dn.t)rem[d.wd]=pv;if(d.wd<today&&dn.n===0)res.pend.push(d)});
    Object.keys(res.plan).forEach(g=>{const remSum=Object.values(rem).reduce((a,p)=>a+p[g],0);if(!res.plan[g]||!remSum)return;const ratio=(res.plan[g]-res.done[g])/remSum;if(ratio<.85&&res.done[g]>0){const k=Math.max(.5,Math.min(1,ratio));Object.keys(rem).forEach(wd=>{if(rem[wd][g])(res.f[wd]=res.f[wd]||{})[g]=Math.min((res.f[wd]||{})[g]||1,k)});res.why.push(`${GRN[g]}: ya llevás ${res.done[g]} de ${res.plan[g]} reps planificadas esta semana; lo que queda va al ${Math.round(k*100)}%.`)}});
    if(rem[today])Object.keys(recent).forEach(g=>{if(rem[today][g]&&recent[g]>=30){(res.f[today]=res.f[today]||{})[g]=Math.min((res.f[today]||{})[g]||1,.7);res.why.push(`Hoy: hiciste ${GRN[g].toLowerCase()} hace menos de 36 h (${recent[g]} reps), así que va al 70%.`)}})}

function resolve(sp,ctx){ctx=ctx||{goal:S.set.rgoal||null,off:S.set.roff||0};S.ov=S.ov||{};const g=ctx.goal&&!sp.keep?GP[ctx.goal]:null,A=painAdj(),DL=deloadOn()?.6:1,kb=(ctx.key||'x')+'|'+(sp.title||''),AD=ctx.noAdapt?{}:(ctx.adapt||{});

function dayBlocksM(d,idx){const n={30:3,45:4,60:5,75:6,90:7,120:9}[d.dur]||5,F=d.foci&&d.foci.length?d.foci:['full'],L=f=>dayBlocks(f,d.goal,90,idx).slice(1);

  if(b.k==='sets'&&P.sub==='rest'){rem=P.restEnd-e;tot=P.restEnd-(P.restSt||0);const n=P.seq[P.i];next=exPh(n.ex,tgt(n),n.load)}
  else if(b.k==='time'&&P.seq[P.i]&&P.seq[P.i].rest){rem=P.rSt+P.seq[P.i].rest-e;tot=P.seq[P.i].rest;const n=P.seq[P.i+1];next=n?exPh(n.ex,n.reps,n.load):null}
  else if(b.k==='int'&&P.seq[P.i]&&P.seq[P.i].rest){rem=P.phEnd-e;tot=P.seq[P.i].dur;const n=P.seq[P.i+1];next=n&&tot>=15?spk(n.ex):null}
  else if(b.k==='amrap'){const r=b.min*60-e,mm=Math.ceil(r/60);if(P.amm!=null&&mm!==P.amm&&mm>=1&&(mm<=5||mm%5===0))say(`Quedan ${mm} ${mm===1?'minuto':'minutos'}`);P.amm=mm;if(r<=10.2&&r>9&&!f.l10){f.l10=1;say('Últimos 10 segundos')}}
  else if(b.k==='emom'){const r=IV(b)-e%IV(b);if(r<=5.2&&r>4.5&&!f['n'+Math.floor(e/IV(b))]){f['n'+Math.floor(e/IV(b))]=1;const m=Math.floor(e/IV(b))+1;if(m<Math.floor(b.min*60/IV(b))){const it=b.items[m%b.items.length];say(`Próximo: ${exPh(it.ex,it.reps,it.load)}`)}}}
  if(rem!=null){if(tot>=50&&rem<=30.2&&rem>29&&!f.h30){f.h30=1;say('Quedan 30 segundos')}if(next&&rem<=8.2&&rem>7&&!f.p8){f.p8=1;say(`Preparate: ${next}`)}}}

  if(P.awk!==P.i+'w'){P.awk=P.i+'w';P.aws=e}const left=autoEst(s)-(e-P.aws);if(left<=0){P.awk=null;say('Serie completa',1);adv();return''}return`<div class="mt hf">Manos libres: la serie se completa sola en ${Math.ceil(left)} s · si hiciste otra cantidad, ajustala con − / +</div>`}

function recStart(){if(!SRC2||REC||!recOn)return;try{REC=new SRC2();REC.lang='es-AR';REC.continuous=true;REC.interimResults=true;
  REC.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++){const tx=(ev.results[i][0].transcript||'').toLowerCase();if(Date.now()-recLast<2500)continue;if(/\b(listo|siguiente|hecho)\b/.test(tx)){recLast=Date.now();if(P.ph==='run'||P.ph==='end')plBtn()}else if(/\bpausa\b/.test(tx)){recLast=Date.now();pause()}}};
  REC.onend=()=>{REC=null;if(recOn&&$('#pl').classList.contains('on'))setTimeout(recStart,400)};
  REC.onerror=e=>{if(e&&(e.error==='not-allowed'||e.error==='service-not-allowed')){recOn=false;toast('Micrófono no disponible en esta vista: probá la versión instalable')}};REC.start()}catch(e){REC=null}}

function strat(steps){const seen={};return steps.map(s=>{if(s.ub)return'Sin cortar (obligatorio)';let t=typ(s.ex);if(!t&&isMU(s.ex))t='mu';if(!t||!s.reps)return'';const k=seen[t]=(seen[t]||0)+1;const mx=S.maxes[t]||(t==='mu'?5:10);const cap=Math.max(t==='mu'?1:3,Math.round(mx*RAT[t]*Math.pow(.9,k-1)*(s.load?.75:1)));const p=split(s.reps,cap);return p.length>1?p.join(' + '):'Sin cortar'})}

function blockToRows(b){const out=[],push=(ex,sets,reps,kg,u)=>{const l=out.find(r=>r.ex===ex&&r.reps===reps&&r.u===u&&(r.kg||0)===(kg||0));if(l)l.sets+=sets;else out.push({ex,sets,reps,kg:kg||0,u})},kgOf=l=>l?parseFloat(String(l).replace(',','.'))||0:0;

  else if(b.k==='time')b.rounds.forEach(r=>r.forEach(s=>push(s.ex,1,+s.reps||0,kgOf(s.load),'reps')));
  else if(b.k==='emom'){const n=b.items.length||1;b.items.forEach((i,j)=>push(i.ex,b.ladder?1:Math.ceil(((b.int?b.min*60/b.int:b.min)-j)/n),+i.reps||5,kgOf(i.load),'reps'))}

  else if(b.k==='int'){if(b.seq)b.seq.filter(s=>!s.rest&&!/descans/i.test(s.ex)).forEach(s=>push(s.ex,1,s.dur,0,'s'));else(b.items||[]).filter(i=>!i.rest&&!/descans/i.test(i.ex)).forEach(i=>push(i.ex,b.rounds||1,i.secs||b.work||30,0,'s'))}

    case'peadr':{const c=pe.blocks[+d.i],s=SECM.includes(c.st);rowsOf(c).push({ex:'',n:ROWM.includes(c.st)||s?(s?30:8):'',u:s?'s':'r',kg:'',mult:1});render();setTimeout(()=>{const x=$(`#pr_${d.i}_${c.rows.length-1}_ex`);if(x)x.focus()},30);break}
    case'pedupb':{const i=+d.i;pe.blocks.splice(i+1,0,clone(pe.blocks[i]));UI.peo=i+1;render();break}

    case'pemk':UI.pemk=!UI.pemk;render();break;
    case'peadd2':{pe.blocks.push(Object.assign(cfgDefaults(d.v),{rows:[]}));const nb=pe.blocks[pe.blocks.length-1];nb.rows=parseLines(MODES[d.v].tx).map(x=>({ex:x.ex,n:x.secs||x.reps||'',u:x.secs?'s':'r',kg:x.load?parseFloat(x.load):'',mult:x.mult||1}));UI.peo=pe.blocks.length-1;UI.pemk=false;render();break}
    case'rbopen':openRb(d.t);break;

    case'rbadd':{const x=UI.rbList[+d.v];if(!x)break;

      else if(UI.pe){if(x.cfg){const c=clone(x.cfg);delete c.rows;UI.pe.blocks.push(c)}else UI.pe.blocks.push({st:'raw',title:'',b:clone(x.b)});UI.peo=null;$('#rbv').classList.remove('on');render();toast(`Agregado: ${x.title}`)}
      break}
  }});
document.addEventListener('input',ev=>{const t=ev.target,m=(t.id||'').match(/^pr_(\d+)_(\d+)_(ex|n|kg)$/);if(!m||!UI.pe)return;const c=UI.pe.blocks[+m[1]];if(!c||!c.rows||!c.rows[+m[2]])return;const r=c.rows[+m[2]];r[m[3]]=m[3]==='ex'?t.value:(t.value===''?'':+t.value);if(m[3]==='ex'){const e=findEx(t.value);if(e&&ROWM.includes(c.st)){r.u=e.u==='s'?'s':'r'}}c.tx=rowsTx(c.rows)});

/* ===================== v9: competencias editables, manuales y desde foto ===================== */
const COMP0=clone(COMP),TIPS0=Object.assign({},TIPS);
const TIPSG=['Contá las reps totales por ejercicio en la tabla de volumen: el que más se repite con menos máximo propio es tu cuello de botella.','La columna Estrategia corta cada serie antes del fallo según tus máximos. Fallar cuesta 30-60 s; una pausa planificada, 3-6 s.','Memorizá la ronda antes de empezar y dejá las estaciones a 1-2 pasos para transiciones de menos de 5 s.','Simulá la competencia completa cada 7-10 días y compará tiempos por ronda en Progreso.'];
function pbName(k){const i=k.lastIndexOf('-'),c=COMP[k.slice(0,i)];return(c?c.n:k.slice(0,i))+' R'+k.slice(i+1)}
function applyComps(){const C=S.comps||{};Object.keys(COMP).forEach(k=>{if(!COMP0[k])delete COMP[k]});Object.keys(COMP0).forEach(k=>{COMP[k]=clone(COMP0[k]);TIPS[k]=TIPS0[k]});
  Object.entries(C).forEach(([k,c])=>{if(!c||!Array.isArray(c.r)||!c.r.length)return;COMP[k]={n:c.n||'Competencia',r:c.r.map(r=>r.map(s=>{const o=st(s.ex,+s.reps||0,s.load||'');if(s.ub)o.ub=1;return o})),custom:!COMP0[k]};if(!TIPS[k])TIPS[k]=TIPSG})}
render=(f=>function(){applyComps();return f.apply(this,arguments)})(render);
function vComp(){applyComps();if(UI.ce)return vCompEdit();if(!COMP[UI.cmp])UI.cmp='piz';const k0=UI.cmp,c=COMP[k0],nR=c.r.length,keys=[],tab={};
  c.r.forEach((r,ri)=>r.forEach(s=>{const t=typ(s.ex)||(isMU(s.ex)?'mu':''),k=t?LBL[t]:s.ex;if(!tab[k]){tab[k]=Array(nR).fill(0);keys.push(k)}tab[k][ri]+=+s.reps||0}));
  const edited=!!(S.comps&&S.comps[k0]&&COMP0[k0]);
  let h=`<div class="card"><div class="chips">${Object.entries(COMP).map(([k,x])=>`<button class="chip${k===k0?' on':''}" data-act="cmp" data-c="${k}">${esc(x.n)}</button>`).join('')}<button class="chip" data-act="cenew">+ Nueva</button></div>
  <div class="row" style="margin-top:8px"><button class="btn sec sm" data-act="ceedit">✎ Editar</button><button class="btn sec sm" data-act="cedup">Duplicar</button>${edited?'<button class="btn sec sm" data-act="cerest">Restaurar original</button>':''}${c.custom?'<button class="btn sec sm" data-act="cedel">Borrar</button>':''}</div>
  ${UI.cnew?cNewCard():''}
  <h2>Volumen por ronda</h2><div class="tw"><table><thead><tr><th>Ejercicio</th>${c.r.map((_,i)=>`<th class="n">R${i+1}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>
  ${keys.map(k=>`<tr><td>${esc(k)}</td>${tab[k].map(v=>`<td class="n">${v||'–'}</td>`).join('')}<td class="n"><b>${tab[k].reduce((a,x)=>a+x,0)}</b></td></tr>`).join('')}</tbody></table></div>
  <p class="mt">Cortes calculados con tus máximos: ${S.maxes.pull} dominadas, ${S.maxes.dips} fondos, ${S.maxes.push} flexiones, ${S.maxes.squat} sentadillas, ${S.maxes.mu||5} muscle ups.</p></div>`;
  c.r.forEach((r,ri)=>{const key=`${k0}-${ri+1}`,pb=S.pb[key],sg=strat(r),b={k:'time',title:`${c.n} · Ronda ${ri+1}`,rounds:[r],rest:0,pb:[key]};
    h+=`<div class="card"><div class="row sb"><h2>Ronda ${ri+1}</h2><span class="pill${pb&&pb.best!=null?' ok':''}">PB ${pb&&pb.best!=null?ftd(pb.best):'—'}</span></div>
    ${pb&&pb.last&&pb.last.length?`<p class="mt">Últimos: ${pb.last.slice(0,5).map(ftd).join(' · ')}</p>`:''}${stratTable(r.map((s,i)=>Object.assign({},s,{sg:sg[i]})))}
    <button class="btn" data-act="run" data-b="${reg(b)}">▶ Simular ronda ${ri+1}</button></div>`});
  if(nR>1)h+=`<div class="card"><h2>Simulación completa</h2><p class="mt">Las ${nR} rondas seguidas; el reloj solo cuenta el trabajo y guarda el tiempo de cada ronda.</p>
  <label for="restMin">Descanso entre rondas (min)<input type="number" inputmode="decimal" min="0" step="0.5" id="restMin" value="${UI.restMin}"></label><button class="btn" data-act="simFull">▶ Simular ${nR} rondas</button></div>`;
  h+=`<div class="card"><h2>Claves para bajar el tiempo</h2><ul class="tips">${(TIPS[k0]||TIPSG).map(t=>`<li>${t}</li>`).join('')}</ul></div>`;return h}
function cNewCard(){return`<div class="card" style="margin-top:10px;background:var(--sf2)"><h3>Nueva competencia</h3><div class="tiles t3">
  <label class="tile" for="cefile"><b>📷 Desde foto</b><span class="mt">Foto del pizarrón</span></label><button class="tile" data-act="cemanual"><b>✏️ Manual</b><span class="mt">Ronda por ronda</span></button><button class="tile" data-act="cetxt"><b>📋 Pegar texto</b><span class="mt">Una línea por ejercicio</span></button></div>
  <input type="file" id="cefile" accept="image/*" hidden><div id="ceSt" class="mt" style="margin-top:6px">${UI.ceSt||''}</div>
  ${UI.cetx!=null?`<label for="ce_tx">Escribí o pegá la competencia. Separá rondas con una línea "Ronda 2" o una línea vacía. Agregá UB al final si va sin cortar.<textarea id="ce_tx" rows="10" placeholder="Ronda 1&#10;MU 3&#10;Dips 25&#10;Pull up 20&#10;&#10;Ronda 2&#10;MU 5 UB&#10;Dips 20 +5kg">${esc(UI.cetx)}</textarea></label><button class="btn sm" data-act="cetxtok">Revisar y guardar</button>`:''}</div>`}
function parseComp(t){const R=[];let cur=null;(t||'').split('\n').forEach(l=>{l=l.trim();if(!l||/^(r|ronda|round)\s*\d*\s*:?$/i.test(l)){if(cur&&cur.length){R.push(cur);cur=null}return}
  let ub=0;l=l.replace(/\s*\b(ub|unbo|unbroken|sin cortar)\b\.?\s*$/i,()=>{ub=1;return''});const p=parseLines(l)[0];if(!p)return;(cur=cur||[]).push({ex:p.ex,reps:p.reps||p.secs||0,load:p.load,ub})});if(cur&&cur.length)R.push(cur);return R}
function vCompEdit(){const E=UI.ce;let h=`<div class="card"><span class="eyebrow">${E.isNew?'Nueva competencia':'Editar competencia'}</span><label for="ce_n">Nombre<input id="ce_n" value="${esc(E.n||'')}" placeholder="Ej. Copa Norte · Avanzado"></label>
  ${E.ai?'<p class="pill am" style="white-space:normal">Leída desde la foto: revisá nombres y números antes de guardar.</p>':''}${!E.isNew&&COMP0[E.k]?'<p class="mt">Si cambiás una ronda se reinicia su récord.</p>':''}</div>`;
  E.r.forEach((r,i)=>{h+=`<div class="card"><div class="row sb"><h3>Ronda ${i+1} <span class="mt">· ${r.reduce((a,s)=>a+(+s.reps||0),0)} reps</span></h3>${E.r.length>1?`<button class="btn sec sm" data-act="cerdel" data-i="${i}">Quitar ronda</button>`:''}</div>
    <div class="prows"><div class="crow ph"><span>Ejercicio</span><span>Reps</span><span>Lastre</span><span>UB</span><span></span></div>${r.map((s,j)=>`<div class="crow"><input list="exl" id="ce_${i}_${j}_ex" value="${esc(s.ex)}" aria-label="Ejercicio"><input type="number" inputmode="numeric" min="0" id="ce_${i}_${j}_reps" value="${s.reps||''}" aria-label="Reps"><input id="ce_${i}_${j}_load" value="${esc(s.load||'')}" placeholder="+5kg" aria-label="Lastre"><button class="ib un${s.ub?' on':''}" data-act="ceub" data-i="${i}" data-j="${j}" aria-pressed="${!!s.ub}" aria-label="Sin cortar">${s.ub?'UB':'–'}</button><button class="ib" data-act="cerow" data-i="${i}" data-j="${j}" aria-label="Quitar">✕</button></div>`).join('')}</div>
    <div class="row" style="margin-top:6px"><button class="btn sec sm" data-act="ceadd" data-i="${i}">+ Ejercicio</button><button class="btn sec sm" data-act="cercp" data-i="${i}">Duplicar ronda</button></div></div>`});
  h+=`<div class="card"><button class="btn sec" data-act="cerad" style="width:100%">+ Ronda</button><p class="mt">UB = sin cortar (unbroken): la estrategia no lo divide y la voz lo avisa.</p></div>
  <div class="pfoot"><button class="btn" data-act="cesave" style="flex:1">Guardar</button><button class="btn sec" data-act="cecancel">Cancelar</button></div>`;return h}
function ceOpen(k,o){const c=o||COMP[k];UI.ce={k,isNew:!COMP[k],n:c.n,r:clone(c.r).map(r=>r.map(s=>({ex:s.ex,reps:s.reps,load:s.load||'',ub:s.ub?1:0}))),ai:!!(o&&o.ai)};UI.cnew=false;UI.cetx=null;render();window.scrollTo(0,0)}
function ceSave(){const E=UI.ce;E.n=(E.n||'').trim()||'Competencia';const r=E.r.map(x=>x.filter(s=>(s.ex||'').trim()&&+s.reps>0).map(s=>Object.assign({ex:s.ex.trim(),reps:+s.reps,load:(s.load||'').trim()},s.ub?{ub:1}:{}))).filter(x=>x.length);if(!r.length)return toast('Agregá al menos un ejercicio con reps');
  const k=E.k||('c'+Date.now().toString(36)),old=COMP[k];if(old)r.forEach((x,i)=>{if(JSON.stringify(x.map(s=>[s.ex,s.reps,s.load,!!s.ub]))!==JSON.stringify((old.r[i]||[]).map(s=>[s.ex,+s.reps,s.load||'',!!s.ub])))delete S.pb[`${k}-${i+1}`]});
  if(old)for(let i=r.length;i<old.r.length;i++)delete S.pb[`${k}-${i+1}`];
  S.comps=S.comps||{};S.comps[k]={n:E.n,r};save();UI.ce=null;UI.cmp=k;render();toast('Competencia guardada')}
async function shrink(file){let url='';try{url=URL.createObjectURL(file);const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});const m=1600,s=Math.min(1,m/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);return await new Promise(ok=>cv.toBlob(b=>ok(b||file),'image/jpeg',.85))}catch(e){return file}finally{if(url)try{URL.revokeObjectURL(url)}catch(e){}}}
function ceStatus(t){UI.ceSt=t;const e=$('#ceSt');if(e)e.innerHTML=t}
async function cePhoto(file){if(!file)return;let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){}
  if(!sample)return ceStatus('La lectura de fotos necesita abrir la app desde claude.ai. Usá Manual o Pegar texto.');
  try{const lim=sample.limits?await sample.limits():{images:true};if(lim&&lim.images===false)return ceStatus('Tu cuenta no permite enviar imágenes ahora. Usá Manual o Pegar texto.')}catch(e){}
  ceStatus('Leyendo la foto…');const img=await shrink(file);
  const prompt=`La imagen es un pizarrón o cartel de una competencia de calistenia por tiempo, con una o más rondas. Transcribila exactamente. Respondé SOLO con JSON válido, sin texto extra, con esta forma: {"n":"nombre o nivel de la competencia","r":[[{"ex":"Pull up","reps":10,"load":"","ub":false}]]}. Reglas: una lista por ronda en el orden del pizarrón; usá estos nombres cuando correspondan: "MU" (muscle up), "Pull up" (dominadas), "Dips" (fondos), "Push up" (flexiones), "Sentadilla", "Australianas", "Jump squats", "L raise", "Burpees"; si no coincide, dejá el nombre como está escrito. "load" es el lastre si aparece (ej. "+5kg"), si no "". "ub" es true si el ejercicio está marcado como sin cortar (UB, UNBO, unbroken o una llave que lo agrupa). Si un número es dudoso, elegí la lectura más probable.`;
  try{const res=await sample(prompt,{images:[img],modelTier:'default'});const m=(res.text||'').match(/\{[\s\S]*\}/);if(!m)throw new Error('sin JSON');const o=JSON.parse(m[0]);
    const r=(o.r||[]).map(x=>(x||[]).map(s=>({ex:String(s.ex||'').trim(),reps:Math.max(0,parseInt(s.reps)||0),load:String(s.load||'').trim(),ub:s.ub?1:0})).filter(s=>s.ex)).filter(x=>x.length);
    if(!r.length)throw new Error('vacío');UI.ceSt='';ceOpen(null,{n:o.n||'Competencia nueva',r,ai:1})}
  catch(e){ceStatus(e&&e.code==='rate_limited'?'Demasiadas consultas seguidas: probá en un minuto.':e&&e.code==='not_granted'?'Sin permiso para usar la IA en esta vista.':'No pude leer la foto. Probá con más luz y el pizarrón entero, o cargala Manual.')}}
document.addEventListener('change',ev=>{if(ev.target.id==='cefile'){const f=ev.target.files&&ev.target.files[0];ev.target.value='';cePhoto(f)}});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,d=t.dataset,E=UI.ce;
  switch(a){
    case'cenew':UI.cnew=!UI.cnew;UI.cetx=null;UI.ceSt='';render();break;
    case'cemanual':ceOpen(null,{n:'',r:[[{ex:'',reps:''}],[{ex:'',reps:''}],[{ex:'',reps:''}]]});break;
    case'cetxt':UI.cetx=UI.cetx==null?'':null;render();break;
    case'cetxtok':{const r=parseComp(UI.cetx);if(!r.length)return toast('No encontré ejercicios con reps');ceOpen(null,{n:'',r});break}
    case'ceedit':ceOpen(UI.cmp);break;
    case'cedup':{const c=COMP[UI.cmp];ceOpen(null,{n:c.n+' (copia)',r:c.r});break}
    case'cerest':ask('¿Volver a la versión original? Se reinician los récords de esta competencia.',()=>{delete S.comps[UI.cmp];Object.keys(S.pb).filter(k=>k.startsWith(UI.cmp+'-')).forEach(k=>delete S.pb[k]);save();render()});break;
    case'cedel':ask('¿Borrar esta competencia? Tus sesiones del historial se mantienen.',()=>{delete S.comps[UI.cmp];UI.cmp='piz';save();render()});break;
    case'cecancel':UI.ce=null;render();break;
    case'cesave':ceSave();break;
    case'ceub':{const s=E.r[+d.i][+d.j];s.ub=s.ub?0:1;render();break}
    case'cerow':E.r[+d.i].splice(+d.j,1);render();break;
    case'ceadd':E.r[+d.i].push({ex:'',reps:'',load:'',ub:0});render();setTimeout(()=>{const x=$(`#ce_${d.i}_${E.r[+d.i].length-1}_ex`);if(x)x.focus()},30);break;
    case'cercp':E.r.splice(+d.i+1,0,clone(E.r[+d.i]));render();break;
    case'cerdel':E.r.splice(+d.i,1);render();break;
    case'cerad':E.r.push([{ex:'',reps:'',load:'',ub:0}]);render();break;
  }});
document.addEventListener('input',ev=>{const t=ev.target,id=t.id||'';if(id==='ce_tx'){UI.cetx=t.value;return}if(!UI.ce)return;if(id==='ce_n'){UI.ce.n=t.value;return}const m=id.match(/^ce_(\d+)_(\d+)_(ex|reps|load)$/);if(m&&UI.ce.r[+m[1]]&&UI.ce.r[+m[1]][+m[2]])UI.ce.r[+m[1]][+m[2]][m[3]]=m[3]==='reps'?(t.value===''?'':+t.value):t.value});
(function(){const s=document.createElement('style');s.textContent=`.crow{display:grid;grid-template-columns:1fr 56px 64px 38px 32px;gap:6px;align-items:center}.crow input{min-width:0}.crow.ph{font-size:.72rem;color:var(--mt);margin-bottom:-4px}.ib.un.on{background:var(--ac);border-color:var(--ac);color:#fff}label.tile{cursor:pointer}`;document.head.appendChild(s)})();
